name: E2E app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'js/**'
      - 'css/**'
      - 'index.html'
      - 'sw.js'
      - 'scripts/e2e.mjs'
      - '.github/workflows/e2e.yml'

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Wait for GitHub Pages
        run: |
          for i in {1..36}; do
            if curl -fsS https://paes2005-design.github.io/App_Financas/ | grep -q 'APP Finanças'; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Run authenticated end-to-end test
        run: node scripts/e2e.mjs
